[package]
name = "tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mman"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
browser = { path = "../browser" }
file_ops = { path = "../file_ops" }
shell_overlay = { path = "../shell_overlay" }
preview = { path = "../preview" }
theming = { path = "../theming" }
plugin_host = { path = "../plugin_host" }
plugin_api = { path = "../plugin_api" }
# The `--text-hook` argument the bundled preview plugin is started with is a JSON document.
serde_json = "1.0"
vfs_ssh = { path = "../vfs_ssh" }
vfs_archive = { path = "../vfs_archive" }
trash = { path = "../trash" }
# `unstable-rendered-line-info` gives `Paragraph::line_count`, which the scrollable preview needs
# to know how many rows wrapped text takes.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"
anyhow = "1.0.104"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm", "tokio"] }
vt100 = "0.16.2"
# `poll`/`read` for the terminal-palette probe, which must time out instead of blocking on stdin.
libc = "0.2"
# Local time for the modified/accessed/created times. Already built for the trash crate; `clock`
# is what reads the machine's time zone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Only for the `DynamicImage` type name in `image_preview.rs` — decoding a picture reuses
# `preview::load_image`, so no format-decoder features are needed here.
image = { version = "0.25.10", default-features = false }

[dev-dependencies]
proptest = "1.11"
# `png` so image_preview's tests can write a real decodable picture for a plugin to "hand over".
image = { version = "0.25.10", features = ["png"] }
