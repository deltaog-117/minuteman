[package]
name = "tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mman"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
browser = { path = "../browser" }
file_ops = { path = "../file_ops" }
shell_overlay = { path = "../shell_overlay" }
preview = { path = "../preview" }
theming = { path = "../theming" }
plugins = { path = "../plugins" }
# `unstable-rendered-line-info` gives `Paragraph::line_count`, which the scrollable preview needs
# to know how many rows wrapped text takes.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"
anyhow = "1.0.104"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm", "tokio"] }
vt100 = "0.16.2"
# Only for the `DynamicImage` type name in `preview_hook.rs` — decoding a hook's output reuses
# `preview::load_image`, so no format-decoder features are needed here.
image = { version = "0.25.10", default-features = false }

[dev-dependencies]
proptest = "1.11"
# `png` so preview_hook's tests can write a real decodable image for a fake hook to "produce".
image = { version = "0.25.10", features = ["png"] }
