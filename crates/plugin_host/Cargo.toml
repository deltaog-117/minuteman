[package]
name = "plugin_host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
shared = { path = "../shared" }
browser = { path = "../browser" }
plugin_api = { path = "../plugin_api" }
file_ops = { path = "../file_ops" }
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread"] }
wasmi = { version = "2", optional = true, default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }
wasmi_wasi = { version = "2", optional = true }

[features]
# Runs a plugin whose `command` ends in `.wasm` inside a wasmi sandbox. Off by default: it adds
# about 2 MB to the binary and nothing else in the host needs it.
wasm = ["dep:wasmi", "dep:wasmi_wasi", "tokio/time"]

[dev-dependencies]
proptest = "1.11"
wat = "1"
tokio = { version = "1", features = ["time"] }

[[bin]]
name = "test-fixture-plugin"
path = "tests/fixtures/plugin.rs"
