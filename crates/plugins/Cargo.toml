[package]
name = "plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
shared = { path = "../shared" }
file_ops = { path = "../file_ops" }
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread"] }

[dev-dependencies]
proptest = "1.11"

[[bin]]
name = "test-fixture-plugin"
path = "tests/fixtures/plugin.rs"
