[package]
name = "shared"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
thiserror = "2.0.20"
# `statvfs`, for how full a mounted device is.
libc = "0.2"
# Times shown in this machine's zone, for the Inspect plugin and the file lists.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
proptest = "1.11"
