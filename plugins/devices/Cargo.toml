[package]
name = "devices"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The rail of devices Minuteman ships as a plugin: it looks at the disks, sticks and network mounts of this machine, mounts, unmounts and ejects them, and sends the list to the host, which draws it."

[[bin]]
name = "mman-devices"
path = "src/main.rs"

[dependencies]
plugin_api = { path = "../../crates/plugin_api" }
shared = { path = "../../crates/shared" }
serde_json = "1.0"
