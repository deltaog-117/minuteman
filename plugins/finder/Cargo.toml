[package]
name = "finder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The fuzzy finder Minuteman ships as a plugin: it ranks what the host walks and the host draws the list."

[[bin]]
name = "mman-finder"
path = "src/main.rs"

[dependencies]
plugin_api = { path = "../../crates/plugin_api" }
shared = { path = "../../crates/shared" }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.11"
