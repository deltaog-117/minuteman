[package]
name = "archiver"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Packs and unpacks zip, tar and tar.gz archives for Minuteman as a plugin: the interface names the work and the plugin does it on the local disk, reporting each entry it reaches."

[[bin]]
name = "mman-archive"
path = "src/main.rs"

[dependencies]
plugin_api = { path = "../../crates/plugin_api" }
shared = { path = "../../crates/shared" }
serde = "1.0.229"
serde_json = "1.0"
thiserror = "2.0.20"
# Zip needs its deflate codec to compress and extract (the preview plugin only reads headers);
# tar has no codec of its own, and gzip is `flate2`. xz, zstd and bzip2 are deliberately left out
# to keep the binary small.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1"

[dev-dependencies]
proptest = "1.11"
