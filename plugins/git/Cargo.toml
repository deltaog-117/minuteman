[package]
name = "git"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The git status Minuteman ships as a plugin: it asks git and fills the status bar's git slots; the host draws them."

[[bin]]
name = "mman-git"
path = "src/main.rs"

[dependencies]
plugin_api = { path = "../../crates/plugin_api" }
shared = { path = "../../crates/shared" }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.11"
