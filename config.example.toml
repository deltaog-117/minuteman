# Minuteman example config.
#
# Copy this file to ~/.config/minuteman/config.toml and edit what you want to change. Any key
# or theme field left out keeps its built-in default (shown below) — a partial file, a missing
# file, and even a file that fails to parse are all fine: Minuteman falls back per-field rather
# than refusing to start.

[keys]
move_down = ["j"]
move_up = ["k"]
enter = ["l", "enter"]
leave = ["h"]
quit = ["q"]
# Quits like `quit`, but also records the directory you were browsing so the `mm` shell wrapper
# (see `minuteman init` in the README) can `cd` your shell there. Single-character keys are
# case-sensitive: "Q" is Shift+q, distinct from "q". Without `--cwd-file` (a bare `minuteman`
# run, not via `mm`) it just quits.
quit_to_cwd = ["Q"]
yank = ["y"]
cut = ["m"]
paste = ["p"]
# Deletes every marked entry (see `select` below) if any are marked, else the current selection.
delete = ["d"]
rename = ["r"]
# A trailing "/" on the typed name creates a directory instead of a file.
create = ["n"]
# Opens the first shell pane in the current directory ("s" again does nothing once one is
# already open — split instead). "esc" closes the focused pane, or exits shell mode entirely
# once it's the last one open.
shell = ["s"]
# Jumps to the first entry whose name matches as you type.
search = ["/"]
# Opens the :-command prompt (":q"/":quit" to exit, ":cd <path>" to jump to a directory).
command = [":"]
# Toggles a mark on the current entry, Ranger-style — press once per file to queue it for a
# later bulk action instead of acting on it immediately.
select = ["v"]
# Reserved for future chorded commands. Currently does nothing and never blocks any other key.
leader = ["space"]
# While any shell pane (see `shell` above) is open, toggles whether keystrokes go to the focused
# pane or drive the browser, so the pane(s) can stay open and visible while you keep browsing.
shell_focus = ["tab"]
# Splits the focused pane side by side (left/right); the new pane's shell starts in the current
# directory and takes focus. Tmux's own default binding, for muscle memory.
shell_split_horizontal = ["%"]
# Splits the focused pane stacked (top/bottom); same directory, new pane takes focus. Also
# tmux's own default binding.
shell_split_vertical = ["\""]
# Cycles keyboard focus to the next pane — useful when a mouse isn't available; click a pane
# directly to focus it instead.
shell_pane_next = ["o"]

[theme]
# Selects a built-in base palette ("default" or "dracula"); an unrecognised name falls back to
# "default". Any color field below overrides just that field on top of the chosen palette.
name = "default"
selection_bg = "blue"
selection_fg = "white"
border_fg = "gray"
title_fg = "white"
dir_fg = "blue"
file_fg = "white"
status_fg = "gray"

# Colors: black, red, green, yellow, blue, magenta, cyan, white, gray (grey also works). An
# unrecognised color name resets to the terminal's default.
