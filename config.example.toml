# Minuteman example config.
#
# Copy this file to ~/.config/minuteman/config.toml and edit what you want to change. Any key
# or theme field left out keeps its built-in default (shown below) — a partial file, a missing
# file, and even a file that fails to parse are all fine: Minuteman falls back per-field rather
# than refusing to start.

[keys]
move_down = ["j"]
move_up = ["k"]
enter = ["l", "enter"]
leave = ["h"]
quit = ["q"]
# Quits like `quit`, but also records the directory you were browsing so the `mm` shell wrapper
# (see `minuteman init` in the README) can `cd` your shell there. Single-character keys are
# case-sensitive: "Q" is Shift+q, distinct from "q". Without `--cwd-file` (a bare `minuteman`
# run, not via `mm`) it just quits.
quit_to_cwd = ["Q"]
yank = ["y"]
cut = ["m"]
paste = ["p"]
# Deletes every marked entry (see `select` below) if any are marked, else the current selection.
delete = ["d"]
rename = ["r"]
# A trailing "/" on the typed name creates a directory instead of a file.
create = ["n"]
# Opens the first shell pane in the current directory ("s" again does nothing once one is
# already open — split instead). "esc" closes the focused pane, or exits shell mode entirely
# once it's the last one open.
shell = ["s"]
# Jumps to the first entry whose name matches as you type.
search = ["/"]
# Opens the :-command prompt (":q"/":quit" to exit, ":cd <path>" to jump to a directory).
command = [":"]
# Toggles a mark on the current entry, Ranger-style — press once per file to queue it for a
# later bulk action instead of acting on it immediately.
select = ["v"]
# The one leader key for every mini-shell command. With a shell open and not being typed into
# (press "esc" in the shell to stop typing), leader followed by: leader again = type in the shell;
# h/j/k/l or the arrows = focus the pane in that direction; "|" = split side by side; "-" = split
# stacked; x = close the focused pane; r/m = resize/move mode (hjkl to nudge, esc to leave);
# t = flip the split's orientation. Does nothing when no shell is open. While typing in a shell,
# every key — this one included — goes to the shell, except "esc".
leader = ["space"]

[theme]
# Selects a built-in base palette: "neon" (the default — cyberpunk cyan/magenta, true color),
# "classic" (the original plain 16-color look), or "dracula". An unrecognised name falls back to
# "neon". Any field below overrides just that field on top of the chosen palette.
name = "neon"

# Colors are a basic name — black, red, green, yellow, blue, magenta, cyan, white, gray (grey also
# works) — or a hex value, "#rrggbb" or "#rgb". Hex is drawn in true color where the terminal
# advertises it (COLORTERM=truecolor) and is mapped to the nearest of 256 colors otherwise. An
# unrecognised color resets to the terminal's default.

# The selected row's background, and its text color — or "keep" to leave each entry in its own
# file-type color and only change the background.
selection_bg = "#2b1a4f"
selection_fg = "keep"
# Frame color of every pane except the active one (the current directory's column, or the
# focused shell), which gets the brighter border below.
border_fg = "#3d4270"
border_focused_fg = "#00f0ff"
title_fg = "#8a8fd6"
# Highlights: the active pane's title, the stripe in front of the selected row, and the "*" on
# marked rows.
accent_fg = "#ff2bd6"
# Entry colors, by kind: directories, source code, config/data files (toml, json, dotfiles, ...),
# documents, archives, images/audio/video, and everything else.
dir_fg = "#00d9ff"
source_fg = "#39ff88"
config_fg = "#ffd60a"
doc_fg = "#b69cff"
archive_fg = "#ff7a3d"
media_fg = "#ff5cf0"
file_fg = "#c8ccff"
status_fg = "#7a80b8"
# Status bar: the segments' background, and the color of destructive prompts (delete, overwrite).
bar_bg = "#1a1f3d"
danger_fg = "#ff3860"
# Frame style: "rounded", "plain", "double", or "thick".
border_type = "rounded"
# Edge between status-bar segments: "arrow" draws Powerline arrows (they need a Powerline/Nerd
# Font — without one they show as missing-glyph boxes), "flat" uses plain dividers, and "auto"
# picks arrows exactly when [ui] glyphs is "nerd".
separator = "auto"

[ui]
# The symbols the interface draws with. The font itself is your terminal's, so pick what it can
# show:
#   "unicode" — box-drawing and geometric symbols; works in nearly any modern font (default).
#   "nerd"    — adds file-type icons and Powerline arrows. Needs a Nerd Font (use the "Mono"
#               variant so icons stay one cell wide), or a Symbols Nerd Font as a fallback.
#   "ascii"   — plain ASCII chrome, for a Linux console or a very limited font.
# Run `minuteman glyphs` to see what each set looks like in your terminal, and
# `minuteman init-terminal <kitty|alacritty|wezterm>` for a matching font + color config.
glyphs = "unicode"
