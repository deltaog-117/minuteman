# Minuteman example config (keybindings).
#
# Copy this file to ~/.config/minuteman/config.toml and edit what you want to change. Any key
# left out keeps its built-in default (shown below) — a partial file, a missing file, and even a
# file that fails to parse are all fine: Minuteman falls back per-field rather than refusing to
# start.

# Tapping Alt on its own (pressed and released with nothing in between) switches between typing
# in the mini-shell and using the file browser. A bare modifier key is only reported by
# terminals with the kitty keyboard protocol (kitty, foot, wezterm, ghostty, recent alacritty),
# and turning it on makes the terminal report every key as an escape code, which Minuteman
# decodes back. If accented or composed characters (dead keys, AltGr) come out wrong inside a
# mini-shell, set this to false; Esc and the `space` leader still switch modes.
alt_tap = true

# Mouse in the file browser: a click selects a row in the middle column, a double-click on a
# directory opens it, a click in the left column goes up and selects that entry, and the wheel
# moves the selection. Clicking the browser also hands the keyboard back from a mini-shell. Set
# this to false to leave the mouse to the mini-shell box only.
browser_mouse = true

# Whether dot-prefixed files and directories are listed when Minuteman starts. The `hidden` key
# below flips it while browsing.
show_hidden = false

# Programs that take over the whole terminal. A `:` command whose first word is one of these
# (":nvim ROADMAP.md", ":less log.txt") suspends Minuteman, runs it on the real terminal, and
# brings the browser back when it exits. Prefix any other command with "!" to do the same for
# just that one (":!python3"). Every other `:` command is run with its output captured.
interactive_commands = [
    "nvim", "vim", "vi", "nano", "emacs", "micro", "hx", "less", "more", "man", "htop", "btop",
    "top", "mpv", "ssh", "tmux", "fzf",
]

[keys]
# The arrow keys browse like hjkl: up/down move the selection, right opens the selected
# directory and left goes up. Naming a key here replaces the whole list for that action, so
# keep "down", "up", "right" and "left" in it if you change these.
move_down = ["j", "down"]
move_up = ["k", "up"]
enter = ["l", "right", "enter"]
leave = ["h", "left"]
quit = ["q"]
# Quits like `quit`, but also records the directory you were browsing so the `mman` shell wrapper
# (see `mman init` in the README) can `cd` your shell there. Single-character keys are
# case-sensitive: "Q" is Shift+q, distinct from "q". Without `--cwd-file` (the bare binary run
# as `command mman`, not through the wrapper) it just quits.
quit_to_cwd = ["Q"]
yank = ["y"]
cut = ["m"]
paste = ["p"]
# Deletes every marked entry (see `select` below) if any are marked, else the current selection.
delete = ["d"]
rename = ["r"]
# A trailing "/" on the typed name creates a directory instead of a file.
create = ["n"]
# Opens the first shell pane in the current directory ("s" again does nothing once one is
# already open — split instead). Alt+m closes the pane under the pointer.
shell = ["s"]
# Finds the nearest entry whose name contains what you type, looking in this directory first and
# then in every directory below it, and jumps there as you type. Enter stays where the search
# landed, Esc goes back to where it started.
search = ["/"]
# Opens the :-command prompt. ":q"/":quit" exits, ":cd <path>" jumps to a directory,
# ":mkdir [-p] <name>..." and ":touch <name>..." create things right here, and anything else is
# run as a shell command in the current directory (":ls -l", ":git mv a b", ":rm old.log"), with
# its output on the status line. Quote names that contain spaces. See `interactive_commands`
# above for running editors and other full-screen programs.
command = [":"]
# Cancels everything pending, in whatever directory you are: the yanked or cut clipboard, every
# mark, and a running copy, move or command. Nothing on disk is touched by a cut until it is
# pasted, so cancelling one just forgets it.
cancel = ["c"]
# Shows or hides dot-prefixed files and directories in every column.
hidden = ["."]
# Toggles a mark on the current entry, Ranger-style — press once per file to queue it for a
# later bulk action instead of acting on it immediately.
select = ["v"]
# The one leader key for every mini-shell command. With a shell open and not being typed into
# (tap Alt or click the browser to stop typing), leader followed by: leader again = type in the shell;
# h/j/k/l or the arrows = focus the pane in that direction; "|" = split side by side; "-" = split
# stacked; x = close the focused pane; r/m = resize/move mode (hjkl to nudge, esc to leave);
# t = flip the split's orientation. Does nothing when no shell is open. While typing in a shell,
# every key — this one included — goes to the shell.
leader = ["space"]

# Colors, text styles (bold, italic, ...), glyphs and fonts live in their own file,
# ~/.config/minuteman/appearance.toml — run `minuteman init-appearance` to print a fully
# commented starting point. A [theme] or [ui] table left in this file still works, but anything
# appearance.toml sets wins.
