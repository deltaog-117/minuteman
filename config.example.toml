# Minuteman example config (keybindings).
#
# Copy this file to ~/.config/minuteman/config.toml and edit what you want to change. Any key
# left out keeps its built-in default (shown below) — a partial file, a missing file, and even a
# file that fails to parse are all fine: Minuteman falls back per-field rather than refusing to
# start.

# Tapping Alt on its own (pressed and released with nothing in between) switches between typing
# in the mini-shell and using the file browser. A bare modifier key is only reported by
# terminals with the kitty keyboard protocol (kitty, foot, wezterm, ghostty, recent alacritty),
# and turning it on makes the terminal report every key as an escape code, which Minuteman
# decodes back. If accented or composed characters (dead keys, AltGr) come out wrong inside a
# mini-shell, set this to false; Esc and the `space` leader still switch modes.
alt_tap = true

# Mouse in the file browser: a click selects a row in the middle column, a double-click opens a
# directory (or a file, with the desktop's default program), a click in the left column goes up
# and selects that entry, the wheel moves the selection, and a right-click opens a menu (Open,
# Open with, Cut, Copy, Paste, Rename, Delete, Inspect, ...). Clicking the browser also hands the
# keyboard back from a mini-shell. Set this to false to leave the mouse to the mini-shell box only.
browser_mouse = true

# Clicking a row with a modifier held selects several entries, the way a desktop file manager
# does: Ctrl+click toggles that entry's mark, and a range click marks everything between the last
# entry clicked and this one (keeping earlier marks). A click on a segment of the header's path
# jumps to that directory, and a middle-click opens an entry. Most terminals keep Shift+mouse for
# their own text selection and never pass it on, so the range click also accepts Alt by default.
# "either" (Shift or Alt), "shift" or "alt".
mouse_range_modifier = "either"

# The status bar's git segment: the branch, how far it is ahead of or behind its upstream, counts
# of staged, modified and untracked files, and the state of the selected file. It runs `git status`
# in the background (read-only, without taking git's index lock) whenever you browse inside a
# repository. Set this to false to never run git.
git_status = true

# Whether dot-prefixed files and directories are listed when Minuteman starts. The `hidden` key
# below flips it while browsing.
show_hidden = false

# The view Minuteman starts in: "list", "grid", "details", "filmstrip", "deck", "wiring" or "atlas". Pressing `V` switches it
# and remembers the choice for next time (saved in ~/.config/minuteman/local.toml, which wins over
# this line once you have used `V`). Leave it out to start on the name list.
# view = "list"

# A brief splash drawn over the browser on startup, for the sake of the look. Off by default, so the
# browser is simply there the moment it starts. When on, the browser is already drawn underneath;
# a key press dismisses the splash and is also handled as usual (a mouse click only dismisses it,
# since it would land on a row hidden behind it), and it clears itself after under a second.
boot_splash = false

# The border gradient's old switch. The gradient is now part of the look: where it is painted and
# which way it runs are `gradient` and `gradient_flow` under [shape] in appearance.toml, its colors
# `gradient_from` and `gradient_to` under [theme], and the appearance popup (a) edits all four.
# `false` here still turns it off wherever appearance.toml doesn't set `gradient`.
gradient_borders = true

# The text preview streams in from the top, line by line, the first time a file is selected — not
# on every redraw, and not once you've scrolled it. Set this to false for it to show in full at
# once, the way every other pane already does.
typewriter_preview = true

# An extra header segment built from /proc: how long this session has been running, the system's
# load average, and memory used/total. Off by default because it is Linux-specific (it reads
# nothing and shows nothing elsewhere) and, unlike the git segment, has nothing to do with the
# files you're browsing.
system_hud = false

# Programs that take over the whole terminal. A `:` command whose first word is one of these
# (":nvim ROADMAP.md", ":less log.txt") suspends Minuteman, runs it on the real terminal, and
# brings the browser back when it exits. Prefix any other command with "!" to do the same for
# just that one (":!python3"). Every other `:` command is run with its output captured.
interactive_commands = [
    "nvim", "vim", "vi", "nano", "emacs", "micro", "hx", "less", "more", "man", "htop", "btop",
    "top", "mpv", "ssh", "tmux", "fzf",
]

# Which program opens which files, ahead of anything the desktop has registered. `enter` and a
# double-click on a file use the first rule that matches, and every matching rule heads the "Open
# with" list. Each `match` entry is a file extension (`md`, `tar.gz`; any letter case) or, when it
# holds a `/`, a MIME type (`image/*`, `text/x-python`). `command` follows the `{}` rules below;
# `name` labels it in the menu (the program's name when left out); `terminal = true` hands the
# terminal over for a program that draws on it whatever its name.
# [[open_rule]]
# match = ["md", "txt"]
# command = "nvim"
#
# [[open_rule]]
# match = "video/*"
# command = "mpv {}"
# name = "mpv"

# What the right-click menu's "Open with" submenu lists after any matching rule, in this order.
# The programs actually installed for the file's type (read from your desktop's `.desktop` files
# and `mimeapps.list`) follow, and "Other…" lets you type a command. `command` runs under
# `sh -c`; a `{}` stands for the file's path (already quoted), and without one the path is added
# on the end. A program named in `interactive_commands` above (an editor, a pager) takes over the
# terminal; anything else is started on its own and left running. With none of these tables and
# nothing installed for the type, the submenu offers your $VISUAL or $EDITOR.
# [[open_with]]
# name = "Neovim"
# command = "nvim"
#
# [[open_with]]
# name = "VLC"
# command = "vlc {}"

# External previewers: a command that renders a thumbnail image or extracts text for a file
# extension the built-in preview can't otherwise show (a PDF, a video, ...). `command` runs under
# `sh -c`; `{in}` stands for the source file's quoted path and `{out}` for a scratch path the
# command must write its result to. `kind` is "image" (decoded and shown like a real image file)
# or "text" (read back and shown like a text file). A missing program, a non-zero exit, a
# timeout, or output `kind` can't make sense of all fall back to just the file's name, quietly —
# never a hard error. `timeout_ms` defaults to 10000 (10 seconds) when left out.
# [[preview_hook]]
# extensions = ["pdf"]
# command = "pdftoppm -png -singlefile {in} {out}; mv {out}.png {out}"
# kind = "image"
#
# [[preview_hook]]
# extensions = ["mp4", "mkv", "webm"]
# command = "ffmpegthumbnailer -i {in} -o {out} -s 512"
# kind = "image"

# Plugins: external processes Minuteman spawns at startup, speaking a small line-delimited
# JSON-RPC protocol over their own stdin/stdout (see the `plugins` crate). Any language that can
# read a line and print one works — no compile step, no per-language bindings — and a plugin
# reaches the same read_dir/copy/mv/delete/create_dir/create_file/touch/rename operations the
# built-in keys use, not a bolted-on subset of them. It can also send `get_state` at any time to
# read the cwd, cursor, marks, sort and view as of the last tick. A plugin can be started three ways:
#   - `on_key`: one key string or a list of them (`on_key = ["b", "B"]`), in the same key-string
#     grammar as [keys] below. A key a built-in already uses stays the built-in's; rebind the
#     built-in in [keys] first. The `key` event says which key fired.
#   - `commands`: `:` command words it answers (`commands = ["blame"]` makes `:blame a.rs` fire
#     it with the arguments). A built-in such as `cd` or `q` is tried first and always wins.
#   - `:plugin <name> [args]` fires the plugin with that `name`, whatever else it declares.
# A plugin can also ask to hear about things as they happen with `events`, a list of any of
# "dir_changed" and "selection_changed" (each with `from` and `to`; a burst of cursor moves
# arrives as one event from where it began to where it ended, and marks changing counts too) and
# "job_finished" (the job's `kind` and `outcome`). It hears none unless it lists them.
# A plugin can also add `:` commands while it runs, with a `register_command` request, so
# `commands` is only needed to have a word answered before the plugin has started. A built-in
# command or a word another plugin has is refused, and the plugin is told why.
# A plugin can run Minuteman's own actions with a `run_action` request naming one, by the same
# word that binds it under [keys] below (`paste`, `sort`, `undo`, `hidden`, ...; `list_actions`
# names them all). It does exactly what the key does, confirmations included, but only while you
# are plainly browsing: with a prompt, popup, chord, focused shell or running job in the way it is
# refused and the plugin is told why. The chord starters (`bookmark_jump`, `bookmark_set`,
# `leader`) cannot be run this way, as they wait for a second key.
# A plugin may exit whenever it likes: it is started again the next time a key, command or
# `:plugin <name>` reaches it (or, if it has no keys or commands, an event). One that crashes
# three times in a row is left alone until `:plugins restart <name>`; `:plugins` lists them all.
# Omit all of them for a plugin that only ever acts on its `init` event. A complete worked example
# in Python, with no dependencies, is `examples/plugins/dir_stats.py`.
# [[plugin]]
# name = "dir-stats"
# command = "python3"
# args = ["~/.config/minuteman/plugins/dir_stats.py"]
# on_key = ["i", "I"]
# commands = ["stats"]
# events = ["dir_changed", "job_finished"]

[panels]
# How many of the miller columns are drawn: "three" (the default — parent | current | preview)
# or "two" (current | preview, each wider, with the parent column removed rather than left
# blank). An unrecognised value falls back to "three".
columns = "three"

# Whether the header row (breadcrumb, marks/clipboard pills) is drawn. Hiding it gives its row
# back to the file columns, the same as switching to "two" above frees the parent column's width.
show_hud = true

# Whether the status bar's idle chrome — the mode pill, the selected file's details, the key
# hints — is drawn while nothing else is happening. The row itself always stays, and a rename/
# delete prompt, a `:` command or a transient message (like "pane orientation toggled") is never
# hidden by this — only the passive display in between.
show_command_bar = true

# All three can also be changed live, for the running session only, from the settings popup —
# press `space` then `t` with no shell pane open. It does not write back to this file.

[keys]
# The arrow keys browse like hjkl: up/down move the selection, right opens the selected
# directory and left goes up. Naming a key here replaces the whole list for that action, so
# keep "down", "up", "right" and "left" in it if you change these.
move_down = ["j", "down"]
move_up = ["k", "up"]
enter = ["l", "right", "enter"]
leave = ["h", "left"]
quit = ["q"]
# Quits like `quit`, but also records the directory you were browsing so the `mman` shell wrapper
# (see `mman init` in the README) can `cd` your shell there. Single-character keys are
# case-sensitive: "Q" is Shift+q, distinct from "q". Without `--cwd-file` (the bare binary run
# as `command mman`, not through the wrapper) it just quits.
quit_to_cwd = ["Q"]
# Marking with `select` (v) is the only way to choose entries. Every operation — yank, cut, both
# deletes, compress and extract, the right-click menu's entries for them and the `:` commands —
# acts on the marks and on nothing else, never on the row under the cursor; with nothing marked
# they just say so. And each one spends the marks it took: after `y` or `d` the entries are on the
# clipboard and nothing is marked any more, and the same goes for a confirmed trash or delete and
# for a compress or extract that starts (declining a question keeps the marks). Choosing and acting
# are two steps: `v` to choose, then the key for what to do.
yank = ["y"]
cut = ["d"]
paste = ["p"]
# Takes back the newest file operation: a create, rename, move, copy or trash (a whole batch, such
# as a paste of several marked files, is one step). Redo does it again. Permanent deletes,
# overwrites, compress/extract and what a `:` shell command does cannot be undone. A created file
# is only removed while it is still empty, and an undone copy goes to the trash.
# Open the compress form (name, where to save it, format, level, an optional password for a zip)
# for the marked entries, and the extract form for the marked archives. Like yank and delete they
# act on marks only. Right-click and the `:compress` / `:extract` commands do the same.
compress = ["C"]
extract = ["E"]
undo = ["z"]
redo = ["Z"]
# Sends every marked entry (see `select` below) to the desktop trash — the same trash
# Nautilus/Dolphin/Explorer/Finder use. Confirms with "y" or enter, since this is reversible.
# ":trash" does the same thing from the `:` prompt, and the trash browser (`trash_view`) shows
# what is in it and puts things back.
delete = ["x"]
# Same batching as `delete`, but permanent: bypasses the trash entirely. Single-character keys are
# case-sensitive (see `quit_to_cwd` above), so "X" is Shift+x, distinct from "x". Confirms with "y"
# only.
delete_permanently = ["X"]
rename = ["r"]
# A trailing "/" on the typed name creates a directory instead of a file.
create = ["n"]
# Unbound by default (Alt+n opens a shell too). Opens the first shell pane in the current directory (the key again does nothing once one is
# already open — split instead). Alt+m closes the pane under the pointer.
shell = []
# Fuzzy search: finds the entries whose names hold the letters you type in order (not necessarily
# side by side, so `aernd` finds `aerend`), looking in this directory first and then in every
# directory below it, and jumps to the best match of the nearest folder that has any as you type.
# Names where the letters sit together, start a word or the name, or the whole text appears as one
# piece rank higher. While the prompt is open, Down or Ctrl-N goes to the next match and Up or
# Ctrl-P to the previous (the status line shows 2/14). Enter stays where the search landed, Esc
# goes back to where it started.
search = ["/"]
# Fuzzy finder: a panel listing every entry below this directory (hidden ones only while they are
# shown), ranked as you type, with a preview of the highlighted one beside it. Type letters that
# appear in order (`rdme` finds `README.md`), or part of a path (`src/main`); a match on the name
# itself ranks above one spread over the folders. Down or Ctrl-N and Up or Ctrl-P move through the
# results, Ctrl-D and Ctrl-U scroll the preview, Enter closes the panel with the cursor on the
# entry in the browser, Esc closes it. Every other key is typed into the query, so j and k are
# letters here. Entries are indexed in the background, so it opens at once on a big tree.
find = ["f"]
# Opens the :-command prompt. ":q"/":q!"/":qa"/":qa!"/":quit" all exit (there's no unsaved-buffer
# or multi-window state for the vim-style "!"/"a" spellings to mean anything different),
# ":cd <path>" jumps to a directory,
# ":mkdir [-p] <name>..." and ":touch <name>..." create things right here, bare ":trash" sends
# the marked/selected entries to the desktop trash, and anything else is run as a shell command in
# the current directory (":ls -l", ":git mv a b", ":rm old.log"), with its output on the status
# line. Quote names that contain spaces. See `interactive_commands` above for running editors and
# other full-screen programs.
command = [":"]
# Cancels everything pending, in whatever directory you are: the yanked or cut clipboard, every
# mark, and a running copy, move or command. Nothing on disk is touched by a cut until it is
# pasted, so cancelling one just forgets it.
cancel = ["c"]
# Shows or hides dot-prefixed files and directories in every column.
hidden = ["."]
# Scrolls the preview column (text, the hex view of a binary file, an archive's listing) by half a
# screen; the wheel over that column scrolls it too. Capitals: "J" is Shift+j, distinct from "j".
preview_down = ["J"]
preview_up = ["K"]
# Switches the browser's view, round and round: the usual columns, then a grid of thumbnail tiles
# (like a graphical file manager's icon view), then a flat details table (name, size, exact
# modified time in your time zone, permissions), then the filmstrip (the selected file as large as the window
# allows, with a strip of its neighbours underneath), then the deck (the usual columns under a strip
# of cards, one for each disk, USB stick and network share: its name, where it is mounted, a gauge of
# how full it is, free space, and a sparkline of how busy it is; the card holding the folder you are in
# has the bright frame, and a stick plugged in slides in). In the deck view Tab takes the keys to the
# cards: Left/Right (or h/l) choose one, Enter opens it (mounting it first if it is not mounted), `m`
# mounts or unmounts it, `e` ejects it (unmounts, then powers the disk off, so it is safe to pull
# out), `p` sends what you are carrying to the chosen device, and Esc or Tab gives the keys back;
# while you are carrying files (yanked or cut, else marked) every card says whether they fit
# ("fits, 22G left", "needs 4.0G more", "a file is over 4.0G" for a FAT32 stick, "same disk, instant"
# for a move within one disk) and a card that cannot take them is dimmed, and `p` refuses it with the
# reason instead of failing halfway through a copy; a click chooses a card, a second click opens it, and the
# wheel moves along them. Mounting uses `udisksctl`, so without it the cards still show but cannot
# change anything. Linux only. After the deck comes the wiring diagram, which takes the whole window:
# how the storage is wired, drawn left to right, one box for each layer (the bus a disk hangs off, the
# disk, its partitions, whatever is stacked on them such as an LVM volume or an encrypted container,
# and the filesystem with where it is mounted and how full it is), joined by lines. A mark moves
# along the line into any disk that is busy, the node holding the folder you are in has the bright
# frame, and in a window too narrow for the columns the same thing is an indented tree. The arrows
# (or h/j/k/l) move through it, Enter opens a filesystem (mounting it first if need be), `m`
# mounts or unmounts it, `e` ejects the whole removable disk the node is on (every volume on it is
# unmounted first, then it is powered off), and `p` sends what you are carrying, with the same fit
# check as the deck. The diagram goes on past the mount point: a filesystem, and then any folder, unfolds
# into its subfolders as more boxes to the right (only folders; the browser is for files; hidden ones
# only while the browser shows them; a folder with many shows the first twelve and "+N more"). Right
# (or l) unfolds the node chosen and, once it is open, goes into its first folder; left (or h) folds
# it, and when it is folded goes back to what it is under; clicking a node chooses it and unfolds or
# folds it. Enter opens the node in the browser (a folder, or the filesystem), and `p` on a folder
# sends the carried files into that folder if its filesystem has room. Opening the view unfolds the
# way down to the folder you are in and chooses it, and the diagram scrolls sideways to keep what you
# chose and what is under it on screen.
# After the wiring diagram comes the atlas, also over the whole window: a map of your storage as
# blocks whose areas follow sizes. It starts with one block per volume (sized by capacity, filled
# from the bottom by how full it is, with a diamond on the one holding your folder); Enter or a
# second click zooms into the chosen block, first to the volume's biggest folders and then into a
# folder; Backspace or Esc zooms out; the arrows (or h/j/k/l) move to the nearest block and Tab walks
# through them biggest first; `o` opens the chosen block's folder in the browser, `a` switches
# between size on disk and apparent size, and `r` looks again. Entries too small for a block of
# their own are folded into one "+N smaller" block.
# Capital: "V" is Shift+v, distinct from "v"
# (marks). In the grid, up/down (and whatever move_down/move_up are bound to) move a whole row, the
# left/right arrows move one tile, `h`/`l`/enter go up and in, and the wheel scrolls a row; in the
# filmstrip, move_down/move_up and the up/down arrows move along the strip. Clicking selects in
# every view and double-clicking opens.
cycle_view = ["V"]
# Opens the trash browser over the whole screen: everything in the desktop trash, newest first,
# with where each item came from and when it was deleted. Choose entries with the mark key (`v`) —
# nothing acts on the row under the cursor unless it is marked — then `r` puts the marked ones back
# where they were (one whose place is taken stays in the trash and says so), `x` deletes them for
# good, and `E` empties the whole trash; both of those ask first (`y`). `c` clears the marks, and
# `q` or Esc closes the view. On a terminal 100 columns or wider, the selected item is previewed
# beside the list exactly as in the browser's own preview column — its text, an image, an
# archive's listing, a hex dump, or a folder's contents — read from where the trash keeps it, so
# nothing has to be restored to be looked at; the keys bound to `preview_down` / `preview_up`
# scroll it.
trash_view = ["T"]
# Orders the folder by the next key — name, size (largest first), modified time (newest first), then
# permissions — and round again; the status line names the order, and the details view marks the
# column with an arrow. Folders always stay first. Clicking a column title in the details view
# picks that key, and clicking it again flips the direction. The order lasts for the session.
sort = [","]
# Runs the current order the other way round (Z to A, smallest first, oldest first).
sort_reverse = ["<"]
# Opens the disk usage view for the folder you are in: what takes the space, biggest first, with a
# bar and a share for each. Inside it, enter opens a folder, h goes up, a switches between the
# size on disk and the apparent size, r scans again and q or Esc closes it. Hard links are counted
# once, other filesystems and symlinks are not entered. Also in the right-click menu.
disk_usage = ["u"]
# Toggles a mark on the current entry — press once per file to choose it for the next operation.
# This is the only way to choose entries; see `yank` above.
select = ["v"]
# Opens the appearance popup: Theme picks the base palette (default, neon, classic, dracula,
# catppuccin, nord or terminal); Accent, Focused border, Selection, Directory, Status bar and Danger are edited as free
# text (enter to type, enter again to confirm, Esc to cancel); Border style, Separator and Glyphs
# cycle through their fixed choices; Reset to defaults clears every change this popup has made
# this session, back to whatever theme/glyphs were already in effect. j/k moves, h/l/enter/a click
# acts on the row under it, Esc or q closes it. Also in the right-click menu on empty space. Every
# change here (and every one the settings popup makes) is saved at once to
# ~/.config/minuteman/local.toml, so it survives a restart — see the note on that file below.
appearance = ["a"]
# Waits for one more key — any letter or digit — naming a bookmark register, then jumps straight
# to the directory saved under it; a register with nothing saved just says so in the status line.
# `m` is already cut above, so bookmark-set below defaults to `B` instead of Ranger's own `m`.
bookmark_jump = ["`"]
# Waits for one more key naming a register, then saves the directory you're browsing under it,
# overwriting whatever that register held before.
bookmark_set = ["B"]
# The one leader key for every mini-shell command, and for the settings popup. With a shell open
# and not being typed into (tap Alt or click the browser to stop typing), leader followed by:
# leader again = type in the shell; h/j/k/l or the arrows = focus the pane in that direction;
# "|" = split side by side; "-" = split stacked; x = close the focused pane; r/m = resize/move
# mode (hjkl to nudge, esc to leave); t = flip the split's orientation. With no shell open, leader
# then t instead opens the settings popup (see [panels] above) — j/k moves its cursor, h/l or
# enter changes the row under it, and Esc or q closes it. While typing in a shell, every key —
# this one included — goes to the shell.
leader = ["space"]


# Colors, text styles (bold, italic, ...), glyphs and fonts live in their own file,
# ~/.config/minuteman/appearance.toml — run `minuteman init-appearance` to print a fully
# commented starting point. A [theme] or [ui] table left in this file still works, but anything
# appearance.toml sets wins.
#
# A third file, ~/.config/minuteman/local.toml, holds whatever the settings and appearance popups
# have saved — it is written by Minuteman itself, never by you, so it has no example or comments
# of its own; edit config.toml/appearance.toml instead and use the popups for anything you'd
# rather set live. Whatever it holds wins over both of the files above, until you change it again
# from inside a popup or delete the file.
